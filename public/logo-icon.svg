<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" role="img" aria-label="Invoicium">
  <!-- Invoicium mark: the periodic-table cell. Element 119, symbol INV.

       Text is set with textLength + lengthAdjust, which pins each string to an
       exact width no matter which font actually resolves. An SVG loaded through
       <img> gets no page CSS and no webfont, so without that pin this renders at
       one width in Chrome and another in a PDF viewer, and the lockup shifts.

       Colours: frame #231F20, tile #E2E8F0, symbol/label the navy pair. -->
  <rect x="6" y="6" width="108" height="108" rx="22" fill="#E2E8F0" stroke="#231F20" stroke-width="6"/>

  <text x="21" y="35" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="17" font-weight="700" fill="#0F0F0F"
        textLength="20" lengthAdjust="spacingAndGlyphs">119</text>

  <text x="60" y="76" text-anchor="middle"
        font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="40" font-weight="700" fill="#22324A"
        textLength="66" lengthAdjust="spacingAndGlyphs">INV</text>

  <text x="60" y="99" text-anchor="middle"
        font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="14" font-weight="700" fill="#3E4C60"
        textLength="60" lengthAdjust="spacingAndGlyphs">Invoicium</text>
</svg>
