<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="Invoicium">
  <!-- Favicon build of the Invoicium cell. The atomic number and the element
       name are dropped: at 16px they are two or three pixels tall and turn into
       grey mush that makes the whole mark look smudged. The frame and INV are
       what identify it in a tab, so they get the whole cell.

       The tile also runs edge to edge here rather than inset -- a favicon has no
       room to spend on padding, and the browser supplies its own. -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="6.5" fill="#E2E8F0" stroke="#231F20" stroke-width="3"/>
  <text x="16" y="22" text-anchor="middle"
        font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="13.5" font-weight="700" fill="#22324A"
        textLength="21" lengthAdjust="spacingAndGlyphs">INV</text>
</svg>
