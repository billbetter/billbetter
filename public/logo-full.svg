<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 240" fill="none" role="img" aria-label="Invoicium">
  <!-- Horizontal lockup: the mark, then the wordmark.

       The cell here carries only INV, not the full 119 / Invoicium cell. Two
       reasons, and they point the same way. The only place this file renders is
       the site nav at 32px tall (Layout.jsx, h-8), where the atomic number and
       the element name inside the cell are under two pixels tall and read as
       grey smudge. And at any size the cell's own "Invoicium" sits a few pixels
       from the wordmark saying the same thing, which is noise even when it is
       legible. The full cell is logo-icon.svg, for app icons and large format.

       Text is pinned with textLength + lengthAdjust: loaded through <img> this
       file gets no page CSS and no webfont, so without it the wordmark would
       set at one width in Chrome and another wherever Inter is missing, and the
       gap between mark and word would move with it.

       Transparent background, not the light grey of the source artwork -- that
       grey was the canvas around the logo, and baking it in would put a grey
       slab behind the mark on every surface it sits on. -->
  <rect x="10" y="15" width="210" height="210" rx="44" fill="#E2E8F0" stroke="#231F20" stroke-width="16"/>
  <text x="115" y="152" text-anchor="middle"
        font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="92" font-weight="700" fill="#22324A"
        textLength="144" lengthAdjust="spacingAndGlyphs">INV</text>

  <text x="256" y="157" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="104" font-weight="700" fill="#22324A"
        textLength="352" lengthAdjust="spacingAndGlyphs">Invoicium</text>
</svg>
